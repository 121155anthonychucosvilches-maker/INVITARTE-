<style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap');

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #101010;
            font-family: sans-serif;
            overflow: hidden;
        }

        .poster {
            position: relative;
            width: 100%; /* CORREGIDO: Cambiado de 120vw a 100% para que no se salga de la pantalla */
            height: 100vh;
            background: url('jul.png') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 4vw 5vw;
        }

        /* Capa superpuesta animada de textura/estrellas */
        .overlay-png {
            position: absolute;
            top: 50%;
            right: 3%;
            width: 100%;
            height: 100%;
            background: url('estrellas.png') center/cover no-repeat;
            pointer-events: none;
            z-index: 1;
            mix-blend-mode: overlay;
            animation: colorShift 6s ease-in-out infinite alternate;
        }

        @keyframes colorShift {
            0% { filter: hue-rotate(0deg) brightness(1) contrast(1.2); opacity: 0.7; }
            50% { filter: hue-rotate(180deg) brightness(1.3) contrast(1.5); opacity: 0.9; }
            100% { filter: hue-rotate(360deg) brightness(1) contrast(1.2); opacity: 0.7; }
        }

        /* Elementos flotantes infantiles de fondo */
        .floating-star {
            position: absolute;
            width: 8vw;
            height: auto;
            z-index: 2;
            pointer-events: none;
            animation: floatStar 3s ease-in-out infinite alternate;
        }

        .star-1 { top: 10%; left: 8%; animation-delay: 0s; transform: rotate(-15deg); }
        .star-2 { top: 19%; right: 10%; animation-delay: 2s; transform: rotate(27deg); width: 5vw; }
        .star-3 { top: 38%; left: 30%; animation-delay: 0.5s; transform: rotate(10deg); width: 7vw; }
        .star-4 { top: 60%; right: 8%; animation-delay: 1.5s; transform: rotate(-25deg); width: 8.5vw; }
        .star-5 { top: 20%; right: 10%; animation-delay: 1s; transform: rotate(-30deg); width: 5vw; }

        @keyframes floatStar {
            0% { transform: translateY(0px) scale(1) rotate(0deg); filter: drop-shadow(0 0 2px #fff); }
            100% { transform: translateY(-12px) scale(1.1) rotate(10deg); filter: drop-shadow(0 0 8px #ffeb3b); }
        }

        .top-text-area, .center-content-area, .bottom-area {
            position: relative;
            z-index: 3;
        }

        .top-text-area {
            margin-top: 2vh;
            display: flex;
            justify-content: center;
        }

        .come-to {
            text-align: center;
            font-family: 'Caveat', cursive;
            font-size: 7.5vw;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        /* Contenedor central absoluto */
        .center-content-area {
            position: absolute;
            top: 45%; /* Ajustado ligeramente hacia arriba para dejar más aire abajo */
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .cumple-anos {
            text-align: center;
            font-family: 'Caveat', cursive;
            font-size: 13vw;
            color: #ffffff;
            margin-top: 4vh;
            margin-bottom: -2vh;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
            font-style: italic;
            animation: doodleWobble 0.8s ease-in-out infinite alternate;
        }

        @keyframes doodleWobble {
            0% { transform: translateY(0px) rotate(-2deg) scale(1); }
            100% { transform: translateY(-5px) rotate(2deg) scale(1.03); }
        }

        .sofia-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0vw;
        }

        .sofia-img {
            height: 28vw;
            width: auto;
            object-fit: contain;
            display: inline-block;
            margin: 0 -4.5vw;
        }

        .sofia-img:nth-child(1) { animation: wave 1.4s ease-in-out infinite alternate; }
        .sofia-img:nth-child(2) { animation: wave 1.6s ease-in-out infinite alternate; animation-delay: 0.2s; }
        .sofia-img:nth-child(3) { animation: wave 1.3s ease-in-out infinite alternate; animation-delay: 0.4s; }

        @keyframes wave {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-3vw) rotate(3deg); }
        }

        /* ÁREA INFERIOR (BOTONES MEJORADOS) */
        .bottom-area {
            display: flex;
            justify-content: center;
            gap: 4vw; /* Un poco menos de espacio entre ellos para que quepan mejor siendo grandes */
            align-items: center;
            flex-wrap: nowrap; /* Evita que se rompan en dos filas en pantallas estándar */
            
            top: 70vh; 
            position: absolute;
            width: 100%;
            padding: 0 4vw;
            box-sizing: border-box;
        }

        .info-link-independiente {
            text-decoration: none;
            display: inline-block;
            filter: drop-shadow(3px 3px 6px rgba(0,0,0,0.5));
            transition: transform 0.2s ease;
            width: 28vw; /* MODIFICADO: Subido de 25vw a 28vw para que sean visiblemente más grandes */
            max-width: 140px; /* Candado de seguridad para pantallas de escritorio muy grandes */
        }

        .info-link-independiente:hover {
            transform: scale(1.1) rotate(0deg);
        }

        /* --- ELEMENTOS INDIVIDUALES --- */
        .lugar-container-independiente {
            transform: rotate(-4deg);
        }

        .fecha-img-independiente {
            transform: rotate(1deg);
        }

        .hora-img-independiente {
            transform: rotate(-2deg);
        }

        .info-png-base {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
