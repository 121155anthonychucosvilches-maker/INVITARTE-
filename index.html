<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOFIA cumple años</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap');

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #101010;
            font-family: sans-serif;
            overflow: hidden;
        }

        .poster {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: url('jul.jpeg') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 4vw 5vw;
        }

        /* Capa superpuesta animada de textura/estrellas */
        .overlay-png {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('estrellas.png') center/cover no-repeat;
            pointer-events: none;
            z-index: 1;
            mix-blend-mode: overlay;
            animation: colorShift 6s ease-in-out infinite alternate;
        }

        @keyframes colorShift {
            0% { filter: hue-rotate(0deg) brightness(1) contrast(1.2); opacity: 0.7; }
            50% { filter: hue-rotate(180deg) brightness(1.3) contrast(1.5); opacity: 0.9; }
            100% { filter: hue-rotate(360deg) brightness(1) contrast(1.2); opacity: 0.7; }
        }

        /* Elementos flotantes infantiles de fondo */
        .floating-star {
            position: absolute;
            width: 8vw;
            height: auto;
            z-index: 2;
            pointer-events: none;
            animation: floatStar 3s ease-in-out infinite alternate;
        }

        .star-1 { top: 10%; left: 8%; animation-delay: 0s; transform: rotate(-15deg); }
        .star-2 { top: 19%; right: 10%; animation-delay: 2s; transform: rotate(27deg); width: 5vw; }
        .star-3 { top: 38%; left: 30%; animation-delay: 0.5s; transform: rotate(10deg); width: 7vw; }
        .star-4 { top: 60%; right: 8%; animation-delay: 1.5s; transform: rotate(-25deg); width: 8.5vw; }
        .star-5 { top: 20%; right: 10s%; animation-delay: 1s; transform: rotate(-30deg); width: 5vw; }

        @keyframes floatStar {
            0% { transform: translateY(0px) scale(1) rotate(0deg); filter: drop-shadow(0 0 2px #fff); }
            100% { transform: translateY(-12px) scale(1.1) rotate(10deg); filter: drop-shadow(0 0 8px #ffeb3b); }
        }

        .top-text-area, .center-content-area, .bottom-area {
            position: relative;
            z-index: 3;
        }

        .top-text-area {
            margin-top: 2vh;
            display: flex;
            justify-content: center;
        }

        .come-to {
            text-align: center;
            font-family: 'Caveat', cursive;
            font-size: 7.5vw;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        /* Contenedor central absoluto */
        .center-content-area {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .cumple-anos {
            text-align: center;
            font-family: 'Caveat', cursive;
            font-size: 13vw;
            color: #ffffff;
            margin-top: 4vh;
            margin-bottom: -2vh;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
            font-style: italic;
            animation: doodleWobble 0.8s ease-in-out infinite alternate;
        }

        @keyframes doodleWobble {
            0% { transform: translateY(0px) rotate(-2deg) scale(1); }
            100% { transform: translateY(-5px) rotate(2deg) scale(1.03); }
        }

        .sofia-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0vw;
        }

        .sofia-img {
            height: 28vw;
            width: auto;
            object-fit: contain;
            display: inline-block;
            margin: 0 -4.5vw;
        }

        .sofia-img:nth-child(1) { animation: wave 1.4s ease-in-out infinite alternate; }
        .sofia-img:nth-child(2) { animation: wave 1.6s ease-in-out infinite alternate; animation-delay: 0.2s; }
        .sofia-img:nth-child(3) { animation: wave 1.3s ease-in-out infinite alternate; animation-delay: 0.4s; }

        @keyframes wave {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-3vw) rotate(3deg); }
        }

        /* ÁREA INFERIOR (BOTONES REUBICADOS) */
        .bottom-area {
            display: flex;
            justify-content: center;
            gap: 16vw;
            align-items: center;
            
            /* CAMBIO AQUÍ: Subido de 60vh a 38vh para alinearlo con estrellas grandes */
            top: 50vh; 
            position: absolute;
            width: 100%;
            box-sizing: border-box;
        }

        .info-link-independiente {
            text-decoration: none;
            display: inline-block;
            filter: drop-shadow(3px 3px 6px rgba(0,0,0,0.5));
            transition: transform 0.2s ease;
            width: 25vw;
        }

        .info-link-independiente:hover {
            transform: scale(1.1) rotate(0deg);
        }

        /* --- ELEMENTOS INDIVIDUALES --- */

        .lugar-container-independiente {
            transform: rotate(-4deg);
        }

        .fecha-img-independiente {
            transform: rotate(1deg);
        }

        .hora-img-independiente {
            transform: rotate(-2deg);
        }

        .info-png-base {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

<div class="poster">
    <div class="overlay-png"></div>

    <!-- Elementos infantiles decorativos flotantes -->
    <svg class="floating-star star-1" viewBox="0 0 24 24" fill="#FFEB3B"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    <svg class="floating-star star-2" viewBox="0 0 24 24" fill="#FF4081"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    <svg class="floating-star star-3" viewBox="0 0 24 24" fill="#00E676"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    <svg class="floating-star star-4" viewBox="0 0 24 24" fill="#00B0FF"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    <svg class="floating-star star-5" viewBox="0 0 24 24" fill="#FFFFFF"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>

    <div class="top-text-area">
        <div class="come-to">ven al</div>
    </div>

    <div class="center-content-area">
        <div class="cumple-anos">cumple años de</div>
        <div class="sofia-container">
            <img src="s.png" alt="S" class="sofia-img">
            <img src="o.png" alt="O" class="sofia-img">
            <img src="l.png" alt="L" class="sofia-img">
        </div>
    </div>

    <div class="bottom-area">
        <!-- 1. LUGAR (LINK ARREGLADO AQUÍ) -->
        <a href="https://maps.app.goo.gl/x7pTnN4En8xvmPQJ6" target="_blank" class="info-link-independiente lugar-container-independiente">
            <img src="lugar.png" alt="Lugar" class="info-png-base">
        </a>

        <!-- 2. FECHA (Recuerda añadir tu enlace al cronograma aquí) -->
        <a href="AQUÍ TU ENLACE DEL CRONOGRAMA (DRIVE)" target="_blank" class="info-link-independiente fecha-img-independiente">
            <img src="fecha.png" alt="Fecha" class="info-png-base">
        </a>

        <!-- 3. HORA -->
        <a href="#hora" class="info-link-independiente hora-img-independiente">
            <img src="hora.png" alt="Hora" class="info-png-base">
        </a>
    </div>
</div>

</body>
</html>
